<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peoples Vision Zero — LA Corners</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; top: 44px; bottom: 0; left: 0; right: 0; }

  #header {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 14px;
    background: #1b1b1f;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    position: relative;
    z-index: 1000;
    overflow: hidden;
  }
  #header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #stats { color: #cfd2d8; font-size: 12.5px; white-space: nowrap; flex: none; }
  #stats b { color: #fff; }

  @media (max-width: 600px) {
    #header h1 { font-size: 13px; }
    #stats { display: none; }
  }

  .legend {
    background: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    font-size: 12.5px;
    line-height: 1.6;
    color: #222;
  }
  .legend .row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .legend .dot { border-radius: 50%; display: inline-block; flex: none; }

  .popup-title { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
  .popup-sub { font-size: 11.5px; color: #666; margin-bottom: 8px; }
  .incident {
    border-top: 1px solid #e5e5e5;
    padding: 6px 0;
    font-size: 12.5px;
  }
  .incident:first-child { border-top: none; }
  .incident .when { font-weight: 600; }
  .incident .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 700;
    color: #fff;
    margin-left: 6px;
  }
  .badge.fatal { background: #c0122f; }
  .badge.injury { background: #e08a00; }
  .victims { color: #333; margin-top: 2px; }
  .hr-note { color: #a33; font-size: 11px; margin-top: 2px; }
  .incident-list { max-height: 260px; overflow-y: auto; padding-right: 4px; }
  .leaflet-popup-content { margin: 10px 12px; }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .district-line { color: #444; font-size: 11.5px; margin-bottom: 8px; }

  .leaflet-control-layers label { font-size: 12.5px; }
</style>
</head>
<body>

<div id="header">
  <h1>Peoples Vision Zero — LA Corners</h1>
  <div id="stats">Loading…</div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FATAL_COLOR = "#c0122f";
const INJURY_COLOR = "#e08a00";
const PAINTED_COLOR = "#F5C800";

const DISTRICT_COLORS = [
  "#e6194b","#3cb44b","#ffbe19","#4363d8","#f58231",
  "#911eb4","#42d4c4","#f032e6","#9acd32","#fb9a99",
  "#469990","#c9a0ff","#9a6324","#5b9bd5","#a9a9a9"
];

function radiusFor(count) {
  return Math.min(6 + Math.sqrt(count - 1) * 5, 22);
}

function fmtDate(iso) {
  if (!iso) return "Unknown date";
  const [y, m, d] = iso.split("-");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
}

function victimLine(victims) {
  const labels = { pedestrian: "Pedestrian", bicyclist: "Bicyclist", motorcyclist: "Motorcyclist", other: "Vehicle occupant" };
  const parts = [];
  for (const key of ["pedestrian", "bicyclist", "motorcyclist", "other"]) {
    const v = victims[key];
    if (v.killed > 0 || v.injured > 0) {
      const bits = [];
      if (v.killed > 0) bits.push(`${v.killed} killed`);
      if (v.injured > 0) bits.push(`${v.injured} injured`);
      parts.push(`${labels[key]}: ${bits.join(", ")}`);
    }
  }
  return parts.length ? parts.join(" · ") : "No injuries recorded";
}

function popupHtml(corner) {
  const title = [corner.primary_rd, corner.secondary_rd].filter(Boolean).join(" & ");
  const n = corner.incidents.length;
  let html = `<div class="popup-title">${title}</div>`;
  html += `<div class="popup-sub">${n} incident${n > 1 ? "s" : ""} recorded (2015–2025)</div>`;
  html += `<div class="district-line">Council District ${corner.council_district}</div>`;
  html += `<div class="incident-list">`;
  for (const inc of corner.incidents.slice().reverse()) {
    const isFatal = inc.killed > 0;
    html += `<div class="incident">`;
    html += `<span class="when">${fmtDate(inc.date)}${inc.time ? " · " + inc.time : ""}</span>`;
    html += `<span class="badge ${isFatal ? "fatal" : "injury"}">${isFatal ? "FATAL" : "INJURY"}</span>`;
    html += `<div class="victims">${victimLine(inc.victims)}</div>`;
    if (inc.hit_and_run !== "No" && inc.hit_and_run !== "Unknown") {
      html += `<div class="hr-note">${inc.hit_and_run}</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

const map = L.map("map", { preferCanvas: true }).setView([34.0522, -118.2437], 11);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const legend = L.control({ position: "bottomleft" });
legend.onAdd = function () {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `
    <div class="row"><span class="dot" style="width:10px;height:10px;background:${FATAL_COLOR}"></span> Corner had a fatal collision</div>
    <div class="row"><span class="dot" style="width:10px;height:10px;background:${INJURY_COLOR}"></span> Injury only, no fatality</div>
    <div class="row"><span class="dot" style="width:8px;height:8px;background:#999;border-radius:50%"></span> larger dot = more incidents at that corner</div>
    <div class="row"><span class="dot" style="width:10px;height:10px;background:${PAINTED_COLOR};border:1px solid #111"></span> Painted by People's Vision Zero</div>
  `;
  return div;
};
legend.addTo(map);

const districtLayer = L.layerGroup();

fetch("city_boundary.geojson")
  .then(r => r.json())
  .then(gj => {
    L.geoJSON(gj, {
      style: { color: "#222", weight: 2, fill: false, opacity: 0.6 },
      interactive: false,
    }).addTo(map);
  });

fetch("districts.geojson")
  .then(r => r.json())
  .then(gj => {
    L.geoJSON(gj, {
      interactive: false,
      style: (feature) => ({
        color: "#fff",
        weight: 1,
        fillColor: DISTRICT_COLORS[(feature.properties.district - 1) % DISTRICT_COLORS.length],
        fillOpacity: 0.18,
      }),
    }).addTo(districtLayer);
  });

districtLayer.addTo(map);

const paintedLayer = L.layerGroup();
  map.createPane("paintedPane");
  map.getPane("paintedPane").style.zIndex = 650;
  const paintedRenderer = L.svg({ pane: "paintedPane" });
fetch("painted.json")
  .then(r => r.json())
  .then(corners => {
    for (const c of corners) {
      const marker = L.circleMarker([c.lat, c.lng], {
        radius: 8,
                            renderer: paintedRenderer,
        color: "#111",
        weight: 1,
        opacity: 1,
        fillColor: PAINTED_COLOR,
        fillOpacity: 0.95,
      });
      marker.bindPopup(
        `<div class="popup-title">Painted by People's Vision Zero</div>` +
        `<div class="popup-sub">${c.name}</div>`,
        { maxWidth: 280 }
      );
      marker.addTo(paintedLayer);
    }
  })
  .catch(err => console.error("Failed to load painted corners:", err));
paintedLayer.addTo(map);

L.control.layers(null, {
  "Council districts": districtLayer,
  "Painted by PVZ": paintedLayer,
}, { position: "topright", collapsed: false }).addTo(map);

fetch("data.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById("stats").innerHTML =
      `<b>${data.meta.total_corners.toLocaleString()}</b> corners &nbsp;·&nbsp; ` +
      `<b>${data.meta.total_incidents.toLocaleString()}</b> incidents &nbsp;·&nbsp; ` +
      `<b>${data.meta.total_killed.toLocaleString()}</b> killed &nbsp;·&nbsp; ` +
      `<b>${data.meta.total_injured.toLocaleString()}</b> injured`;

    for (const corner of data.corners) {
      const count = corner.incidents.length;
      const marker = L.circleMarker([corner.lat, corner.lng], {
        radius: radiusFor(count),
        color: "#000",
        weight: 0.5,
        opacity: 0.4,
        fillColor: corner.fatal ? FATAL_COLOR : INJURY_COLOR,
        fillOpacity: 0.75,
      }).addTo(map);
      marker.bindPopup(() => popupHtml(corner), { maxWidth: 320 });
    }
  })
  .catch(err => {
    document.getElementById("stats").textContent = "Failed to load data.";
    console.error(err);
  });
</script>
</body>
</html>
